name: Desktop Installer (manual, no release)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/p0-p1-hardening-20261118', 'feat/p2-stock-delivery-selfhost-20261118', 'feat/react-electron-p0-p2-20261118', 'feat/p2-final-react-compatible-20261118', 'feat/p2-operational-mirror-hardening-20261120']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install open-source dependencies for unsigned QA build
        run: npm ci --no-audit --no-fund
      - name: Prepare React UI bundle for API, restart and package verification
        run: |
          npm ci --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
      - name: Test business and API logic
        run: npm run test:core && npm run test:api && npm run ui:test
      - name: Package unsigned installer (no publishing)
        run: npm run build:win
      - name: Assert bundled UI and Windows installer exist
        shell: pwsh
        run: |
          if (!(Test-Path apps/react-ui/dist/index.html)) { throw 'React UI not bundled' }
          if (!(Get-ChildItem artifacts -Recurse -File -Filter '*.exe')) { throw 'Installer NSIS ausente' }
      - name: Verify unsigned NSIS can install silently on a clean disposable Windows runner
        shell: pwsh
        timeout-minutes: 6
        run: |
          $setup = Get-ChildItem artifacts -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          if (!$setup) { throw 'Instalador NSIS Setup não encontrado' }
          $target = Join-Path $env:RUNNER_TEMP 'nexus-clean-install'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList "/S /D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalador terminou com código $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'resources\app.asar'))) { throw 'app.asar não instalado' }
          if (!(Get-ChildItem -Path $target -File -Filter '*.exe')) { throw 'Executável principal não encontrado' }
          Write-Output 'Instalação silenciosa verificada em VM Windows descartável; não comprova hardware físico.'
      - uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-Windows-unsigned
          path: artifacts/*
          retention-days: 7
