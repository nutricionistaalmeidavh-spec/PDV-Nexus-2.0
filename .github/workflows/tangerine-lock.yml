name: P0-P1 Mantine lockfile generation
on:
  pull_request:
    branches: [main]
    paths:
      - apps/react-ui/package.json
      - .github/workflows/tangerine-lock.yml
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve dependency lockfile without install scripts
        run: npm install --package-lock-only --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to working branch only
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- apps/react-ui/package-lock.json; then
            echo "Lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/react-ui/package-lock.json
          git commit -m "build(ui): lock Mantine and Lucide dependency versions"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: tangerine-react-ui-package-lock
          path: apps/react-ui/package-lock.json
          retention-days: 7
