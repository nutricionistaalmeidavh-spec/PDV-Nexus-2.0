name: Browser QA (headless, no release)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'feat/nexus-tangerine-p0-p1-20261121', 'fix/p0-stabilizacao-operacional-20261122']
  push:
    branches: [main, 'feat/p0-p1-hardening-20261118', 'feat/p2-stock-delivery-selfhost-20261118', 'feat/react-electron-p0-p2-20261118', 'feat/p2-final-react-compatible-20261118', 'feat/p2-operational-mirror-hardening-20261120', 'feat/nexus-tangerine-p2-p4-20261121', 'feat/p3-ux-kds-hardware-20261122']
jobs:
  browser-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install local open-source QA dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
          npm install --no-save --omit=dev --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run full browser flow against SQLite
        run: |
          node --experimental-strip-types scripts/qa-react-browser.mjs
          node --experimental-strip-types scripts/qa-parity-browser-v2.mjs
          node --experimental-strip-types scripts/qa-tangerine-p2-p4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDV-Nexus-browser-QA
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 14
