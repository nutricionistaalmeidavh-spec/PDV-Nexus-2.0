name: Browser QA (headless, no release)
on:
  workflow_dispatch:
  push:
    branches: ['feat/p0-p1-hardening-20261118', 'feat/p2-stock-delivery-selfhost-20261118', 'feat/react-electron-p0-p2-20261118']
jobs:
  browser-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install local open-source QA dependencies
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
          npm install --no-save --omit=dev --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run full browser flow against SQLite
        run: |
          node --experimental-strip-types scripts/qa-browser.mjs
          if [ -f scripts/qa-p2-browser.mjs ]; then node --experimental-strip-types scripts/qa-p2-browser.mjs; fi
          node --experimental-strip-types scripts/qa-react-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDV-Nexus-browser-QA
          path: artifacts/qa/*.png
          if-no-files-found: ignore
          retention-days: 7
