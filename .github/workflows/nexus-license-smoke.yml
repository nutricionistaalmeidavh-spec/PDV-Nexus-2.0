name: Commercial license — Windows smoke (no release)
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/commercial-license.mjs'
      - 'apps/server/src/server.mjs'
      - 'apps/server/tests/test_commercial_license*.test.mjs'
      - '.github/workflows/nexus-license-smoke.yml'
permissions:
  contents: read
jobs:
  license-win:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned free runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Exercise signed licenses and commercial HTTP endpoints
        run: node --experimental-strip-types --test apps/server/tests/test_commercial_license.test.mjs apps/server/tests/test_commercial_license_api.test.mjs
