name: CI
on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
jobs:
  core-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Unit and SQLite schema tests
        run: npm test
