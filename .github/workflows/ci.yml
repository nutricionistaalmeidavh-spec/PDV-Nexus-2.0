name: CI
on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
jobs:
  core-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install minimal free runtime QR library
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build offline React UI before host route integration tests
        run: |
          npm ci --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
      - name: Unit and SQLite schema tests
        run: npm test
      - name: JavaScript syntax checks
        run: |
          node --check apps/server/src/server.mjs
          node --check apps/server/src/request-validation.mjs
          node --check apps/server/src/command-service.mjs
          node --check apps/server/src/audit-service.mjs
          node --check apps/server/src/order-read.mjs
          node --check apps/server/src/order-lines.mjs
          node --check apps/server/src/order-lifecycle.mjs
          node --check apps/server/src/order-router.mjs
          node --check apps/server/src/restaurant.mjs
          node --check apps/server/src/table-service.mjs
          node --check apps/server/src/modifier-service.mjs
          node --check apps/server/src/kitchen-service.mjs
          node --check apps/server/src/refunds.mjs
          node --check apps/server/src/lan-security.mjs
          node --check apps/server/src/inventory.mjs
          node --check apps/server/src/delivery.mjs
          node --check apps/server/src/multiunit-sync.mjs
          node --check apps/server/src/operational-mirror.mjs
          node --check apps/server/src/delivery-privacy.mjs
          node --check apps/web/public/menu.js
          node --check apps/web/public/sw.js
  api-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install minimal free runtime QR library
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Build React UI on Windows
        run: |
          npm ci --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
      - name: API tests on Windows
        run: npm run test:api
