name: Temporary Tangerine 3-way integration
on:
  push:
    branches: ['feat/integrate-tangerine-p0-p4-20261121']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge and resolve only reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/nexus-tangerine-p2-p4-20261121
          git merge --no-commit --no-ff origin/feat/nexus-tangerine-p2-p4-20261121 || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ "$conflicts" != $'apps/react-ui/src/App.jsx\napps/react-ui/src/TableOrderPanel.jsx' ]]; then
            echo "Unexpected unresolved files: $conflicts"
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          pattern=re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n",re.M|re.S)
          paths=['apps/react-ui/src/App.jsx','apps/react-ui/src/TableOrderPanel.jsx']
          expected=[1,2]
          for path,count in zip(paths,expected):
              file=Path(path)
              source=file.read_text()
              matches=list(pattern.finditer(source))
              assert len(matches)==count, (path,len(matches))
              def choose(match):
                  ours,theirs=match.group(1),match.group(2)
                  if path.endswith('/App.jsx'):
                      return theirs
                  if 'dashboard-grid' in ours and 'Itens da comanda' in ours:
                      return ours.replace('className="dashboard-grid"','className="dashboard-grid nexus-table-order-grid"').replace('<Panel title="Itens da comanda">','<Panel title="Itens da comanda" icon={ClipboardList}>').replace('className="total-hero"','className="total-hero nexus-table-total"')
                  assert 'PizzaOrderPanel' in ours and 'AdvancedOrderOperations' in ours
                  return ours.replace('<Panel title="Transferir mesa">','<Panel title="Transferir mesa" icon={ArrowRightLeft}>').replace('<Panel title="Divisão da comanda por convidados">','<Panel title="Divisão da comanda por convidados" icon={Users}>')
              output=pattern.sub(choose,source)
              if path.endswith('/App.jsx'):
                  needle=' <AppShell.Main className="main-area">\n'
                  assert output.count(needle)==1
                  banner='  {licenseInfo?.required&&<div className="notice" role="status">{licenseInfo.active?(licenseInfo.kind===\\'TRIAL\\'?\\'Avaliação de 3 dias\\':\\'Licença comercial\\')+\\' · \\'+(licenseInfo.expiresAt?\\'Válida até \\'+new Date(licenseInfo.expiresAt).toLocaleString(\\'pt-BR\\'):\\'Sem vencimento\\'):\\'Acesso somente leitura. Avaliação encerrada.\\'}{licenseInfo.active&&licenseInfo.kind===\\'TRIAL\\'&&licenseInfo.expiresAt&&Date.parse(licenseInfo.expiresAt)-Date.now()<=86400000?\\' · Seu teste termina em menos de 24 horas.\\':null}</div>}\n'
                  banner=banner.replace("\\'","'")
                  output=output.replace(needle,needle+banner)
                  needle=' </AppShell>\n'
                  assert output.count(needle)==1
                  output=output.replace(needle,' {modal?.type===\\'refund-items\\'&&<PartialRefundDialog orderId={modal.orderId} api={api} onClose={()=>setModal(null)} onDone={()=>{setModal(null);void refresh();}}/>}\n'+needle)
                  output=output.replace("\\'","'")
              assert '<<<<<<<' not in output and '>>>>>>>' not in output
              file.write_text(output)
          app=Path(paths[0]).read_text()
          panel=Path(paths[1]).read_text()
          for token in ["licenseInfo?.required","PartialRefundDialog","AppShell.Main"]:
              assert token in app, token
          for token in ["LineEditDialog","Ver histórico dos itens","PizzaOrderPanel","WeighedOrderPanel","TableQrPanel","AdvancedOrderOperations","GuestPayments","nexus-table-order-grid"]:
              assert token in panel,token
          print('Compatibilização App e TableOrderPanel OK: UI Tangerine + licença trial + estorno parcial + edição de itens + pizzaria + balança + QR + operações avançadas.')
          
          PY
          git add apps/react-ui/src/App.jsx apps/react-ui/src/TableOrderPanel.jsx
          test -z "$(git ls-files -u)"
          git diff --check
      - name: Remove ephemeral integration workflow from merge tree
        shell: bash
        run: git rm .github/workflows/tangerine-reconcile.yml
      - name: Verify React, local domain and API
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/react-ui --ignore-scripts --no-audit --no-fund
          npm run ui:test
          npm run ui:build
          npm test
          npm run test:api
      - name: Commit integration if validation passes
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'chore: integrate Tangerine P0-P4 with current main'
          git push origin HEAD:feat/integrate-tangerine-p0-p4-20261121
